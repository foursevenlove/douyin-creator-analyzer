[project]
name = "douyin-creator-study"
version = "0.1.0"
description = "Evidence-backed Douyin creator research for Codex"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["jinja2>=3.1,<4", "pillow>=10,<14"]

[project.optional-dependencies]
douyin = ["playwright>=1.51,<2", "yt-dlp>=2026.3.17"]

[project.scripts]
creator-study = "creator_study.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/creator_study"]
